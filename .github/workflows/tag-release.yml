name: tag-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to create
        required: true
      sha:
        description: Commit SHA to tag
        required: true
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Create tag ref
        uses: actions/github-script@v9
        env:
          TAG: ${{ github.event.inputs.tag }}
          SHA: ${{ github.event.inputs.sha }}
        with:
          script: |
            const { TAG, SHA } = process.env;
            if (!/^[A-Za-z0-9._\/-]{1,100}$/.test(TAG) || TAG.includes('..')) throw new Error('invalid tag');
            if (!/^[0-9a-f]{40}$/.test(SHA)) throw new Error('invalid sha');
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${TAG}`,
              sha: SHA,
            });
