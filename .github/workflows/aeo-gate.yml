# AEO/SEO gate + tools/ unit tests on every PR and on main. Merge = deploy
# for this repo, so this is the last automated check before a change goes live.
name: AEO gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeo-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/check_aeo.py compares against `git show origin/main:<path>`
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Unit tests (tools/test_*.py)
        run: python -m pytest -q tools/

      - name: AEO/SEO gate (every indexable page)
        run: python tools/aeo_seo_check.py
